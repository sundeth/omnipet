<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnipet - Documentation</title>
  <link rel="stylesheet" href="assets/main.css">
</head>
<body>
  <div class="layout">
    <nav class="navbar">
      <a class="navbar-logo" href="pages/home.html" target="content"><img src="assets/OmnimonLogo.png" alt="Omnipet"></a>
      <div class="nav-links">
        <a href="pages/home.html" target="content" class="active">Home</a>
        <a href="pages/manual.html" target="content">Manual</a>
        <a href="pages/online-play.html" target="content">Online Play</a>
        <a href="pages/module-guide.html" target="content">Module Guide</a>
        <a href="pages/module-editor.html" target="content">Module Editor</a>
        <a href="pages/build-guide.html" target="content">Build Guide</a>
        <a href="pages/troubleshooting.html" target="content">Troubleshooting</a>
        <a href="pages/changelog.html" target="content">Changelog</a>
        <a href="pages/about.html" target="content">About</a>
        <a href="pages/installation-guide.html" target="content" class="nav-install">Installation</a>
      </div>
    </nav>
    <iframe id="content" name="content" class="content-frame" src="pages/home.html" title="Documentation page"></iframe>
  </div>
  <script>
    // Highlight the page shown in the frame. Clicks are enough: pages opened
    // from inside the frame (links between pages) update it on load when the
    // browser allows reading the frame's address (not always from file://).
    (function () {
      var links = document.querySelectorAll('.nav-links a, .navbar-logo');
      function mark(href) {
        var name = href.split('/').pop().split('#')[0];
        document.querySelectorAll('.nav-links a').forEach(function (a) {
          a.classList.toggle('active', a.getAttribute('href').split('/').pop() === name);
        });
      }
      links.forEach(function (a) {
        a.addEventListener('click', function () { mark(a.getAttribute('href')); });
      });
      document.getElementById('content').addEventListener('load', function () {
        try { mark(this.contentWindow.location.pathname); } catch (e) { /* file:// may refuse */ }
      });
    })();
  </script>
</body>
</html>
